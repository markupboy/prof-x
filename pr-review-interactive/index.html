<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PR review</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="/renderer.js"></script>
</head>
<body>
<div id="banner" class="banner" hidden></div>

<header class="header">
  <div class="header-row">
    <div>
      <h1 id="title">Loading review…</h1>
      <div class="header-meta" id="meta"></div>
    </div>
    <div class="header-actions">
      <button class="btn" id="btn-activity" title="Activity log">Activity</button>
      <button class="btn" id="btn-export" title="Write pr_reviews/review_N.md now">Export markdown</button>
      <button class="btn danger-outline" id="btn-end" title="Stop the server and export">End session</button>
    </div>
  </div>
</header>

<div class="content">
  <section id="summary" class="summary" hidden></section>
  <section id="activity" class="activity" hidden></section>

  <div class="filters" id="filters">
    <div class="filter-group" data-filter="severity">
      <button class="chip on" data-value="Critical">Critical <span class="count" data-count="Critical"></span></button>
      <button class="chip on" data-value="Important">Important <span class="count" data-count="Important"></span></button>
      <button class="chip on" data-value="Suggestion">Suggestion <span class="count" data-count="Suggestion"></span></button>
    </div>
    <div class="filter-group">
      <label class="toggle"><input type="checkbox" id="show-dismissed"> show dismissed</label>
      <label class="toggle"><input type="checkbox" id="show-posted" checked> show posted</label>
    </div>
    <div class="filter-hint">j/k next·prev · v verify · d dismiss · q queue</div>
  </div>

  <main id="findings"></main>
</div>

<div class="queue-bar" id="queue-bar" hidden>
  <span id="queue-count">0 queued</span>
  <button class="btn primary" id="btn-submit">Submit review…</button>
</div>

<div class="toast-host" id="toasts"></div>
<div class="modal-root" id="modal" hidden></div>

<script src="/app.js"></script>
</body>
</html>
